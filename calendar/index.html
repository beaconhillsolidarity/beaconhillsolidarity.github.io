        eventDidMount: function (info) {
            var details = [];
            if (info.event.extendedProps.time) { details.push(info.event.extendedProps.time); }
            if (info.event.extendedProps.location) { details.push(info.event.extendedProps.location); }
            if (details.length) {
                var el = document.createElement('div');
                el.className = 'fc-event-location';
                el.textContent = details.join(' \u00b7 ');
                info.el.appendChild(el);
                info.el.title = details.join(' \u00b7 ');
            }
